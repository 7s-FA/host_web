name: Publish simulation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Test simulation rules
        run: |
          python3 host/system_config.py --write-web-policy
          python3 -m unittest discover -s tests -p "test_system_config.py"
          node host/build_scenarios.cjs
          node tests/engine.test.cjs
          node tests/waypoint-routes.test.cjs
          node tests/navigation.test.cjs
          node tests/host-client.test.cjs
          node tests/ros-client.test.cjs
          node tests/host-stages.test.cjs
          node tests/step-ui.test.cjs
          node tests/settings.test.cjs
          python3 -m unittest discover -s tests -p "test_host.py"
          python3 -m unittest discover -s tests -p "test_live_control.py"
          python3 host/package.py
          python3 -m unittest discover -s tests -p "test_team_package.py"
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp dashboard.css control.html control.css control.js HOST_CONTROL_GUIDE.md ros-config.js ros-client.js ROS_BRIDGE_GUIDE.md index.html styles.css app.js engine.js host-client.js config.js settings.js admin.html admin.js admin.css downloads.html downloads.css waypoints.html waypoints.css waypoints.js routes-burger1.json routes-burger2.json system-config.json system-policy.js host-test.zip _site/
          if test -f waypoints-burger1.json; then cp waypoints-burger1.json _site/; fi
          cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
